  - main [ref=f2e141]:
    - generic [ref=f2e143]:
      - heading "Biografia" [level=1] [ref=f2e144]
      - paragraph [ref=f2e145]: Francesco Scarselli è nato a Campobasso il 15 aprile 2006 ed è originario di Campochiaro. Ha iniziato a suonare l'organetto a sei anni.
      - paragraph [ref=f2e146]: Fra il 2015 e il 2019 ha vinto quattro volte di fila la Categoria A del Festival dell'Adriatico, il Campionato del Mondo di Montescaglioso nel 2015 con 99,50 su 100 e quello di Bologna nel 2016 con 99 su 100, nella sezione fisarmonica diatonica a otto bassi. Nel 2016 il Presidente della Giunta Regionale del Molise gli ha conferito il riconoscimento Bimbo Regione Molise. Nel 2017 è andato in onda su Canale 5 a The Little Big Show con Gerry Scotti; nel 2018 è entrato nel Tour Siciliano del World Accordion Festival; nel 2019 ha vinto l'Accordeon Art Festival di Roseto degli Abruzzi.
      - paragraph [ref=f2e147]: Nel 2020 il M° Igor Zavadsky lo ha invitato a Kiev per due concerti. Nello stesso anno ha cominciato a studiare fisarmonica jazz e variété con il M° Renzo Ruggieri. Nel 2021 ha vinto la categoria World Music, senza limiti di età, all'Internationaler Akkordeonwettbewerb di Klingenthal.
      - paragraph [ref=f2e148]: Poi sono arrivati il Primo Assoluto 15 & Under Variety al British College of Accordionists, la Medaglia d'Oro Variété e la categoria Art Accordion all'Italia Award, l'Accordion Star International 2022, il Laszlo Spezzaferri International Music Prize con 100 su 100 e la categoria Junior del British College of Accordionists. Al Concorso Paolo Barrasso di Caramanico Terme, ancora 100 su 100.
      - paragraph [ref=f2e149]: "Nel 2023, in due mesi, ha vinto i tre concorsi più importanti del mondo: il 9 settembre la Coupe Mondiale CIA a Bijeljina con 24,07 su 25, il 14 settembre il Premio Internazionale della Fisarmonica a Castelfidardo con 19,85 su 20, il 4 novembre il Trofeo Mondiale CMA."
      - paragraph [ref=f2e150]: Oggi studia al Conservatorio Gaetano Braga di Teramo, suona una Bugari Armando e porta la fisarmonica jazz in concerto in Italia e all'estero.
