      - generic [ref=e56]:
        - heading "Chi è" [level=2] [ref=e57]
        - paragraph [ref=e58]: Francesco Scarselli è nato a Campobasso nel 2006 ed è cresciuto a Campochiaro. Ha cominciato a suonare l'organetto a sei anni e a undici era campione del mondo.
        - paragraph [ref=e59]: Nel 2020 ha incontrato la fisarmonica jazz e il suo maestro, Renzo Ruggieri. Oggi studia al Conservatorio Gaetano Braga di Teramo e suona una Bugari Armando.
        - paragraph [ref=e60]: In due mesi del 2023 ha vinto i tre concorsi più importanti al mondo, uno dietro l'altro.
        - paragraph [ref=e61]:
          - link "La storia per esteso" [ref=e62] [cursor=pointer]:
