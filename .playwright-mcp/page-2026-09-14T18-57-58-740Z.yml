        - heading "Chi è" [level=2] [ref=f2e56]
        - paragraph [ref=f2e57]: Francesco Scarselli è nato a Campobasso nel 2006 ed è cresciuto a Campochiaro. Ha cominciato a suonare l'organetto a sei anni e a undici era campione del mondo.
        - paragraph [ref=f2e58]: Nel 2020 ha incontrato la fisarmonica jazz e il suo maestro, Renzo Ruggieri. Oggi studia al Conservatorio Gaetano Braga di Teramo e suona una Bugari Armando.
        - paragraph [ref=f2e59]: In due mesi del 2023 ha vinto i tre concorsi più importanti al mondo, uno dietro l'altro.
        - paragraph [ref=f2e60]:
          - link "La storia per esteso" [ref=f2e61] [cursor=pointer]:
